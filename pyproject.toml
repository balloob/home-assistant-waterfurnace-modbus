[project]
name = "waterfurnace-modbus-hass-tests"
version = "0"
description = "Dev/test environment for the WaterFurnace Aurora (Modbus) custom integration."
# The test harness pins the Home Assistant version it ships, and Home
# Assistant 2026.8 requires Python 3.14.
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # The vendored device library's only dependency; also provides the
    # in-memory MockModbusConnection the tests run against. The tmodbus extra
    # matches the manifest requirement, so connection.py imports at top level.
    "modbus-connection[tmodbus]>=4.8.1",
    # Real Home Assistant plus its custom-component test harness.
    "pytest-homeassistant-custom-component",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
# The test harness needs Python 3.14, but the integration still has to import
# on the oldest Home Assistant a HACS user may run it on — so no 3.14-only
# syntax (PEP 758 except clauses) in the component itself.
target-version = "py313"
# Vendored verbatim from balloob/waterfurnace-modbus; not linted here.
extend-exclude = ["custom_components/waterfurnace_modbus/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
combine-as-imports = true
